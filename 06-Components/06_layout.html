<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application layout</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        display: flex;
      }
      nav {
        height: 100vh;
        width: 10%;
        background-color: rgb(82, 79, 79);
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      nav h2 {
        color: white;
        font-weight: bolder;
        /* padding-left: 15px; */
        padding-top: 10px;
      }
      .container {
        width: 90%;
        background-color: antiquewhite;
      }
      .header {
        height: 10%;
        background-color: rgb(104, 83, 240);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .button1 {
        margin-left: 20px;
      }
      .btn {
        background-color: rgba(97, 97, 137, 0.6);
        padding: 5px;
        color: white;
      }
      .button2 {
        margin-right: 20px;
      }
      .trashbtn {
        padding: 5px;
        color: white;
        background-color: red;
      }
      .main {
        height: 90%;
        background-color: azure;
        display: flex;
      }
      .common {
        height: 100%;
      }
      .section1 {
        width: 20%;
        background-color: rgb(219, 233, 233);
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        align-items: center;
      }
      .section2 {
        width: 65%;
      }
      .section3 {
        width: 15%;
        background-color: rgb(219, 233, 233);
      }
      .email {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 70%;
        background-color: rgb(136, 153, 153);
      }
      .email h2 {
        padding: 15px 30px;
      }
      .section2,
      .section3 {
        display: flex;
        justify-content: center;
      }
      .section2 h2,
      .section3 h2 {
        padding-top: 15px;
      }
    </style>
  </head>
  <body>
    <nav>
      <h2>Nav</h2>
    </nav>
    <div class="container">
      <div class="header">
        <div class="button1">
          <button class="btn">New</button>
          <button class="btn">Reply</button>
          <button class="btn">Forward</button>
          <button class="btn">Mark Unread</button>
        </div>
        <div class="button2">
          <button class="trashbtn">Trash</button>
        </div>
      </div>
      <div class="main">
        <div class="section1 common">
          <div class="email">
            <h2>Email 1</h2>
          </div>
          <div class="email">
            <h2>Email 2</h2>
          </div>
          <div class="email">
            <h2>Email 3</h2>
          </div>
          <div class="email">
            <h2>Email 4</h2>
          </div>
          <div class="email">
            <h2>Email 5</h2>
          </div>
          <div class="email">
            <h2>Email 6</h2>
          </div>
        </div>
        <div class="section2 common">
          <h2>Email View</h2>
        </div>
        <div class="section3 common">
          <h2>Additional Info</h2>
        </div>
      </div>
    </div>
  </body>
</html>
